name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set your Hugging Face Space repository: <username>/<space-name>
          # You can configure HF_SPACE as a GitHub repository variable or secret,
          # or update the fallback below.
          SPACE_REPO="${{ vars.HF_SPACE || secrets.HF_SPACE || 'farmrisk-in/farmrisk-rag' }}"
          echo "Syncing branch main to Hugging Face Space: $SPACE_REPO"
          git push --force https://git:$HF_TOKEN@huggingface.co/spaces/$SPACE_REPO main
